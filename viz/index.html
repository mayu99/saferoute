<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SafeRoute — San Francisco emergency route visualization showing road status and shelter locations.">
  <title>SafeRoute — SF Junction Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep: #0a0e1a;
      --bg-card: rgba(18, 24, 42, 0.85);
      --bg-glass: rgba(255,255,255,0.04);
      --border-glass: rgba(255,255,255,0.08);
      --text-primary: #e8ecf4;
      --text-secondary: #8892a8;
      --accent-green: #34d399;
      --accent-green-glow: rgba(52,211,153,0.35);
      --accent-red: #f87171;
      --accent-red-glow: rgba(248,113,113,0.35);
      --accent-blue: #60a5fa;
      --accent-blue-glow: rgba(96,165,250,0.25);
      --accent-amber: #fbbf24;
      --accent-amber-glow: rgba(251,191,36,0.35);
      --shelter-fill: #818cf8;
      --shelter-glow: rgba(129,140,248,0.4);
      --route-highlight: #facc15;
      --route-highlight-glow: rgba(250,204,21,0.4);
      --radius: 16px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Ambient background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 600px; height: 600px;
      background: var(--accent-blue);
      top: -200px; left: -100px;
    }
    body::after {
      width: 500px; height: 500px;
      background: var(--shelter-fill);
      bottom: -150px; right: -80px;
    }

    header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border-glass);
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: #0a0e1a;
      box-shadow: 0 0 20px var(--accent-green-glow);
    }
    .logo-text {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo-text span {
      color: var(--accent-green);
    }
    .header-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn:hover::after { opacity: 1; }

    .btn-hazard {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: #fff;
      box-shadow: 0 4px 20px rgba(220,38,38,0.3);
    }
    .btn-hazard:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(220,38,38,0.45);
    }
    .btn-hazard:active { transform: translateY(0); }
    .btn-hazard:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-household {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      box-shadow: 0 4px 20px rgba(37,99,235,0.3);
    }
    .btn-household:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(37,99,235,0.45);
    }
    .btn-household:active { transform: translateY(0); }

    .btn-reset {
      background: var(--bg-glass);
      color: var(--text-primary);
      border: 1px solid var(--border-glass);
    }
    .btn-reset:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.15);
    }

    .form-input {
      width: 100%;
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent-blue);
    }
    textarea.form-input {
      resize: vertical;
    }
    .form-row {
      margin-top: 10px;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      padding: 24px 32px;
      gap: 24px;
    }

    .map-container {
      flex: 1;
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }
    .map-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* SVG styles */
    .road-line {
      stroke-width: 3.5;
      stroke-linecap: round;
      transition: stroke 0.5s ease, filter 0.5s ease, opacity 0.5s ease;
    }
    .road-line.open {
      stroke: var(--accent-green);
      filter: drop-shadow(0 0 6px var(--accent-green-glow));
      opacity: 0.85;
    }
    .road-line.closed {
      stroke: var(--accent-red);
      filter: drop-shadow(0 0 8px var(--accent-red-glow));
      opacity: 1;
      stroke-dasharray: 10 6;
      animation: dash-move 1s linear infinite;
    }
    @keyframes dash-move {
      to { stroke-dashoffset: -16; }
    }

    /* Highlighted route path */
    .road-line.route-highlight {
      stroke: var(--route-highlight);
      stroke-width: 5;
      filter: drop-shadow(0 0 10px var(--route-highlight-glow));
      opacity: 1;
      animation: route-pulse 1.5s ease-in-out infinite;
    }
    @keyframes route-pulse {
      0%, 100% { stroke-width: 5; }
      50% { stroke-width: 7; }
    }

    /* Transient "this route just broke" overlay, shown briefly on reroute
       before the new route draws in */
    .road-line.route-old {
      stroke: var(--accent-red);
      stroke-width: 5;
      filter: drop-shadow(0 0 10px var(--accent-red-glow));
      opacity: 0.9;
      animation: route-pulse 0.6s ease-in-out infinite;
    }

    .road-label {
      font-family: 'Inter', sans-serif;
      font-size: 9.5px;
      font-weight: 600;
      fill: var(--text-secondary);
      pointer-events: none;
      transition: fill 0.4s ease;
    }
    .road-label.closed-label {
      fill: var(--accent-red);
    }

    .junction-dot {
      transition: r 0.3s ease, filter 0.3s ease;
      cursor: pointer;
    }
    .junction-dot:hover {
      filter: drop-shadow(0 0 14px var(--accent-blue-glow));
    }

    .junction-label {
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      fill: var(--text-primary);
      pointer-events: none;
    }

    .shelter-ring {
      fill: none;
      stroke: var(--shelter-fill);
      stroke-width: 2;
      opacity: 0.5;
      animation: pulse-ring 2.5s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { r: 26; opacity: 0.15; }
      50% { r: 32; opacity: 0.35; }
    }

    .shelter-circle {
      fill: var(--shelter-fill);
      filter: drop-shadow(0 0 10px var(--shelter-glow));
      cursor: pointer;
      transition: var(--transition);
    }
    .shelter-circle:hover {
      filter: drop-shadow(0 0 18px var(--shelter-glow));
    }

    .shelter-bed-label {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 800;
      fill: #0a0e1a;
      pointer-events: none;
    }
    .shelter-name-label {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: var(--shelter-fill);
      pointer-events: none;
    }
    .shelter-icons-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      pointer-events: none;
    }

    /* Household marker */
    .household-marker {
      fill: var(--accent-amber);
      filter: drop-shadow(0 0 8px var(--accent-amber-glow));
      animation: marker-drop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes marker-drop {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .household-label {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 700;
      fill: var(--accent-amber);
      pointer-events: none;
    }

    /* Side panel */
    .side-panel {
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      padding: 20px;
    }
    .panel-card h3 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 13px;
      font-weight: 500;
    }
    .legend-swatch {
      width: 28px;
      height: 4px;
      border-radius: 2px;
    }
    .legend-swatch.open { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green-glow); }
    .legend-swatch.closed {
      background: var(--accent-red);
      box-shadow: 0 0 8px var(--accent-red-glow);
      background-image: repeating-linear-gradient(90deg, var(--accent-red) 0 6px, transparent 6px 10px);
    }
    .legend-swatch.route {
      background: var(--route-highlight);
      box-shadow: 0 0 8px var(--route-highlight-glow);
    }
    .legend-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
    }
    .legend-dot.junction { background: var(--accent-blue); box-shadow: 0 0 8px var(--accent-blue-glow); }
    .legend-dot.shelter { background: var(--shelter-fill); box-shadow: 0 0 8px var(--shelter-glow); }
    .legend-dot.household { background: var(--accent-amber); box-shadow: 0 0 8px var(--accent-amber-glow); }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-box {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .stat-value {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-value.green { color: var(--accent-green); }
    .stat-value.red { color: var(--accent-red); }
    .stat-value.blue { color: var(--accent-blue); }
    .stat-value.purple { color: var(--shelter-fill); }
    .stat-value.amber { color: var(--accent-amber); }
    .stat-label {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .event-log {
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .event-log::-webkit-scrollbar { width: 4px; }
    .event-log::-webkit-scrollbar-track { background: transparent; }
    .event-log::-webkit-scrollbar-thumb { background: var(--border-glass); border-radius: 2px; }

    .log-entry {
      font-size: 12px;
      font-weight: 500;
      padding: 8px 10px;
      background: var(--bg-glass);
      border-radius: 8px;
      border-left: 3px solid var(--accent-red);
      animation: slide-in 0.3s ease-out;
    }
    .log-entry.log-info {
      border-left-color: var(--accent-blue);
    }
    .log-entry .log-time {
      color: var(--text-secondary);
      font-size: 10px;
      display: block;
      margin-bottom: 2px;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(220,38,38,0.95);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 32px rgba(220,38,38,0.4);
      z-index: 100;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast.info {
      background: rgba(37,99,235,0.95);
      box-shadow: 0 8px 32px rgba(37,99,235,0.4);
    }

    @media (max-width: 900px) {
      main { flex-direction: column; padding: 16px; }
      .side-panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
      .panel-card { flex: 1; min-width: 200px; }
      header { padding: 16px; flex-wrap: wrap; gap: 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-group">
    <div class="logo-icon">SR</div>
    <div>
      <div class="logo-text">Safe<span>Route</span></div>
      <div class="header-subtitle">SF Emergency Route Visualization</div>
    </div>
  </div>
  <div class="controls">
    <button class="btn btn-reset" id="btn-reset" onclick="resetAll()">↺ Reset All</button>
    <button class="btn btn-hazard" id="btn-hazard" onclick="triggerHazard()">🔥 Fire closes Bay Street</button>
  </div>
</header>

<main>
  <div class="map-container">
    <svg id="map-svg" viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="junction-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--accent-blue)" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="var(--accent-blue)" stop-opacity="0"/>
        </radialGradient>
        <filter id="glow-soft">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- Grid dots for ambiance -->
      <pattern id="grid-dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="20" cy="20" r="0.8" fill="rgba(255,255,255,0.06)"/>
      </pattern>
      <rect width="880" height="520" fill="url(#grid-dots)"/>
      <!-- Roads and junctions rendered by JS -->
      <g id="routes-layer"></g>
      <g id="roads-layer"></g>
      <g id="labels-layer"></g>
      <g id="junctions-layer"></g>
      <g id="households-layer"></g>
    </svg>
  </div>

  <div class="side-panel">
    <div class="panel-card">
      <h3>Add Household</h3>
      <form id="household-form" onsubmit="return submitHouseholdForm(event)">
        <textarea
          id="household-text"
          class="form-input"
          rows="3"
          placeholder="Describe the household (e.g. &quot;wheelchair user with a dog&quot;)"
        ></textarea>
        <select id="household-junction" class="form-input form-row"></select>
        <button
          type="submit"
          class="btn btn-household form-row"
          style="width:100%; justify-content:center;"
        >🏠 Submit Request</button>
      </form>
    </div>
    <div class="panel-card">
      <h3>Network Stats</h3>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-value green" id="stat-open">0</div>
          <div class="stat-label">Open</div>
        </div>
        <div class="stat-box">
          <div class="stat-value red" id="stat-closed">0</div>
          <div class="stat-label">Closed</div>
        </div>
        <div class="stat-box">
          <div class="stat-value purple" id="stat-beds">0</div>
          <div class="stat-label">Beds</div>
        </div>
        <div class="stat-box">
          <div class="stat-value amber" id="stat-households">0</div>
          <div class="stat-label">Placed</div>
        </div>
      </div>
    </div>
    <div class="panel-card">
      <h3>Legend</h3>
      <div class="legend-item"><div class="legend-swatch open"></div> Road Open</div>
      <div class="legend-item"><div class="legend-swatch closed"></div> Road Closed</div>
      <div class="legend-item"><div class="legend-swatch route"></div> Assigned Route</div>
      <div class="legend-item"><div class="legend-dot junction"></div> Junction</div>
      <div class="legend-item"><div class="legend-dot shelter"></div> Shelter (occ / total)</div>
      <div class="legend-item"><div class="legend-dot household"></div> Household</div>
    </div>
    <div class="panel-card" style="flex:1;">
      <h3>Event Log</h3>
      <div class="event-log" id="event-log">
        <div style="font-size:12px;color:var(--text-secondary);padding:8px 0;">No events yet.</div>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  API — live data from `jac start api.jac --no_client` (port 8000)
// ═══════════════════════════════════════════════════════════════════
const API_BASE = "http://localhost:8000";

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// POST /walker/<name> with a JSON body, unwrap the envelope, return the
// walker's first report (or null on any failure — errors are surfaced via
// toast/log, not thrown, since button handlers don't want to deal with catch).
async function postWalker(name, body) {
  let res;
  try {
    res = await fetch(`${API_BASE}/walker/${name}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    });
  } catch (err) {
    // A CORS block and "server isn't running" both surface as a generic
    // TypeError here — the Fetch API deliberately hides the distinction from
    // JS for security reasons. Check the browser console: a CORS block shows
    // an explicit "... has been blocked by CORS policy" message there (not
    // here). `jac start`'s single-process mode hardwires
    // access-control-allow-origin: * with no config knob, so a real CORS
    // block here would mean something else is sitting in front of it
    // (a proxy/gateway) stripping that header — don't silently add one of
    // your own to work around it, fix or remove whatever is in the middle.
    console.error(`[SafeRoute] fetch to /walker/${name} failed:`, err);
    showToast(
      `Can't reach the API at ${API_BASE}. Is "jac start api.jac --no_client" ` +
      `running? Check the browser console — a CORS-policy message there means ` +
      `something between the page and the server is stripping CORS headers ` +
      `(jac start itself allows all origins).`,
      "hazard"
    );
    addLogEntry("hazard", `⚠ Network error calling ${name} — see browser console.`);
    return null;
  }

  let data;
  try {
    data = await res.json();
  } catch (err) {
    showToast(`API returned a non-JSON response (HTTP ${res.status}).`, "hazard");
    return null;
  }

  if (!res.ok || data.ok === false) {
    const msg = (data.error && data.error.message) || `HTTP ${res.status}`;
    showToast(`API error: ${msg}`, "hazard");
    addLogEntry("hazard", `⚠ ${name} failed: ${msg}`);
    return null;
  }

  const reports = (data.data && data.data.reports) || [];
  return reports.length > 0 ? reports[0] : null;
}

// ─── Map get_state()'s API shape onto the shape render() expects ───────
function mapApiState(apiState) {
  const junctions = apiState.junctions.map(j => ({
    id: j.name, x: j.x, y: j.y,
    shelter: j.shelter ? {
      name: j.shelter.name,
      beds: j.shelter.total_beds,
      occupied: j.shelter.occupied,
      pets: j.shelter.pets_allowed,
      wheelchair: j.shelter.wheelchair_accessible
    } : null
  }));

  const roads = apiState.roads.map(r => ({
    from: r.from, to: r.to, label: r.label, status: r.status
  }));

  const roadByLabel = {};
  roads.forEach(r => { roadByLabel[r.label] = r; });

  const perJunctionCount = {};
  const households = [];
  const highlightedRoutes = [];

  apiState.households.forEach(h => {
    const count = perJunctionCount[h.junction] || 0;
    perJunctionCount[h.junction] = count + 1;

    households.push({
      junction: h.junction,
      name: h.ref,
      rawRequest: h.raw_request,
      needs: h.needs,
      shelter: h.assignment ? h.assignment.shelter_name : null,
      offsetX: count * 18,
      offsetY: -count * 6
    });

    if (h.assignment && h.assignment.route && h.assignment.route.length > 0) {
      routeToSegments(h.junction, h.assignment.route, roadByLabel)
        .forEach(seg => highlightedRoutes.push(seg));
    }
  });

  return { junctions, roads, households, highlightedRoutes };
}

// A route comes back from the API as a list of road LABELS, not junction
// hops — walk them from the household's junction, flipping each road's
// stored from/to as needed depending on which way the route traverses it.
function routeToSegments(startJunction, routeLabels, roadByLabel) {
  const segments = [];
  let current = startJunction;
  routeLabels.forEach(label => {
    const road = roadByLabel[label];
    if (!road) return;
    const next = road.from === current ? road.to : road.from;
    segments.push({ from: current, to: next });
    current = next;
  });
  return segments;
}

function populateJunctionDropdown(state) {
  const select = document.getElementById("household-junction");
  const previous = select.value;
  select.innerHTML = "";
  state.junctions.forEach(j => {
    const opt = document.createElement("option");
    opt.value = j.id;
    opt.textContent = j.shelter ? `${j.id} (${j.shelter.name})` : j.id;
    select.appendChild(opt);
  });
  if (previous && state.junctions.some(j => j.id === previous)) {
    select.value = previous;
  }
}

let STATE = { junctions: [], roads: [], households: [], highlightedRoutes: [] };

async function fetchState() {
  const apiState = await postWalker("get_state", {});
  if (!apiState) return null;
  const mapped = mapApiState(apiState);
  STATE = mapped;
  populateJunctionDropdown(mapped);
  render(mapped);
  return mapped;
}

// ─── Helpers ─────────────────────────────────────────────────────
function junctionById(state, id) {
  return state.junctions.find(j => j.id === id);
}

function midpoint(a, b) {
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}

function angleDeg(a, b) {
  let deg = Math.atan2(b.y - a.y, b.x - a.x) * (180 / Math.PI);
  if (deg > 90) deg -= 180;
  if (deg < -90) deg += 180;
  return deg;
}

const svgNS = "http://www.w3.org/2000/svg";

function el(tag, attrs, parent) {
  const e = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

// ═══════════════════════════════════════════════════════════════════
//  render(state) — redraws the entire SVG from the state object
// ═══════════════════════════════════════════════════════════════════
function render(state) {
  const routesLayer     = document.getElementById("routes-layer");
  const roadsLayer      = document.getElementById("roads-layer");
  const labelsLayer     = document.getElementById("labels-layer");
  const junctionsLayer  = document.getElementById("junctions-layer");
  const householdsLayer = document.getElementById("households-layer");

  routesLayer.innerHTML     = "";
  roadsLayer.innerHTML      = "";
  labelsLayer.innerHTML     = "";
  junctionsLayer.innerHTML  = "";
  householdsLayer.innerHTML = "";

  // ── Build set of highlighted edges for quick lookup ────────
  const hlSet = new Set();
  (state.highlightedRoutes || []).forEach(seg => {
    hlSet.add(`${seg.from}->${seg.to}`);
    hlSet.add(`${seg.to}->${seg.from}`);
  });

  // ── Roads ─────────────────────────────────────────────────
  state.roads.forEach((road, i) => {
    const a = junctionById(state, road.from);
    const b = junctionById(state, road.to);
    const cls = road.status === "open" ? "open" : "closed";
    const isHL = hlSet.has(`${road.from}->${road.to}`);

    // Draw base road line
    el("line", {
      x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      class: `road-line ${cls}`,
      "data-road-index": i
    }, roadsLayer);

    // Overlay highlighted route on top (in routesLayer so it draws above)
    if (isHL && road.status === "open") {
      el("line", {
        x1: a.x, y1: a.y, x2: b.x, y2: b.y,
        class: "road-line route-highlight"
      }, routesLayer);
    }

    // Road label
    const mid = midpoint(a, b);
    const angle = angleDeg(a, b);
    const labelCls = road.status === "closed" ? "road-label closed-label" : "road-label";
    const t = el("text", {
      x: mid.x, y: mid.y - 6,
      "text-anchor": "middle",
      class: labelCls,
      transform: `rotate(${angle}, ${mid.x}, ${mid.y - 6})`
    }, labelsLayer);
    t.textContent = road.label;
  });

  // ── Junctions ─────────────────────────────────────────────
  state.junctions.forEach(j => {
    const isShelter = j.shelter !== null;
    const r = isShelter ? 22 : 8;

    if (isShelter) {
      const s = j.shelter;

      // Animated pulse ring
      el("circle", {
        cx: j.x, cy: j.y, r: 28,
        class: "shelter-ring"
      }, junctionsLayer);

      // Shelter circle
      el("circle", {
        cx: j.x, cy: j.y, r: r,
        class: "shelter-circle"
      }, junctionsLayer);

      // Occupied / Total beds label inside circle
      const bedText = el("text", {
        x: j.x, y: j.y + 3,
        "text-anchor": "middle",
        class: "shelter-bed-label"
      }, junctionsLayer);
      bedText.textContent = `${s.occupied}/${s.beds}`;

      // Accessibility icons below circle
      const icons = [];
      if (s.pets)       icons.push("🐕");
      if (s.wheelchair) icons.push("♿");
      if (icons.length > 0) {
        const iconText = el("text", {
          x: j.x, y: j.y + r + 14,
          "text-anchor": "middle",
          class: "shelter-icons-label"
        }, junctionsLayer);
        iconText.textContent = icons.join(" ");
      }

      // Shelter name below icons
      const nameText = el("text", {
        x: j.x, y: j.y + r + (icons.length > 0 ? 28 : 14),
        "text-anchor": "middle",
        class: "shelter-name-label"
      }, junctionsLayer);
      nameText.textContent = s.name;
    } else {
      // Glow behind dot
      el("circle", {
        cx: j.x, cy: j.y, r: 20,
        fill: "url(#junction-glow)"
      }, junctionsLayer);

      el("circle", {
        cx: j.x, cy: j.y, r: r,
        fill: "var(--accent-blue)",
        class: "junction-dot",
        filter: "url(#glow-soft)"
      }, junctionsLayer);
    }

    // Junction name above
    const labelY = isShelter ? j.y - r - 10 : j.y - 16;
    const label = el("text", {
      x: j.x, y: labelY,
      "text-anchor": "middle",
      class: "junction-label"
    }, junctionsLayer);
    label.textContent = j.id;
  });

  // ── Household markers ─────────────────────────────────────
  state.households.forEach(h => {
    const j = junctionById(state, h.junction);
    if (!j) return;
    const ox = h.offsetX || 0;
    const oy = h.offsetY || 0;

    // Diamond marker
    const size = 7;
    const cx = j.x + ox;
    const cy = j.y + oy;
    const marker = el("polygon", {
      points: `${cx},${cy - size} ${cx + size},${cy} ${cx},${cy + size} ${cx - size},${cy}`,
      class: "household-marker"
    }, householdsLayer);
    const needsSuffix = (h.needs && h.needs.length > 0) ? ` needs: ${h.needs.join(", ")}` : "";
    el("title", {}, marker).textContent =
      `${h.name}${h.rawRequest ? " — " + h.rawRequest : ""}${needsSuffix}` +
      (h.shelter ? ` → ${h.shelter}` : " (no shelter assigned)");

    // Name label
    const hl = el("text", {
      x: cx, y: cy - size - 5,
      "text-anchor": "middle",
      class: "household-label"
    }, householdsLayer);
    hl.textContent = h.name;
  });

  // ── Stats ─────────────────────────────────────────────────
  const openCount   = state.roads.filter(r => r.status === "open").length;
  const closedCount = state.roads.filter(r => r.status === "closed").length;
  const totalOcc    = state.junctions.reduce((s, j) => s + (j.shelter ? j.shelter.occupied : 0), 0);
  const totalBeds   = state.junctions.reduce((s, j) => s + (j.shelter ? j.shelter.beds     : 0), 0);

  document.getElementById("stat-open").textContent       = openCount;
  document.getElementById("stat-closed").textContent     = closedCount;
  document.getElementById("stat-beds").textContent       = `${totalOcc}/${totalBeds}`;
  document.getElementById("stat-households").textContent = state.households.length;

  // Disable fire button once Bay St is already closed
  const bayStRoad = state.roads.find(r => r.label === "Bay St");
  document.getElementById("btn-hazard").disabled = !!(bayStRoad && bayStRoad.status === "closed");
}

// ═══════════════════════════════════════════════════════════════════
//  Actions — all hit the live API, then refetch/re-render from it.
//  Nothing here mutates STATE directly; STATE is always a reflection of
//  the last successful get_state() response.
// ═══════════════════════════════════════════════════════════════════

// 🔥 Close Bay St via trigger_hazard(), briefly flash the old (now-broken)
// routes in red, then draw the rerouted state.
async function triggerHazard() {
  const roadLabel = "Bay St";
  const already = STATE.roads.find(r => r.label === roadLabel && r.status === "closed");
  if (already) {
    showToast(`${roadLabel} is already closed!`);
    return;
  }

  const hazardBtn = document.getElementById("btn-hazard");
  hazardBtn.disabled = true;

  const result = await postWalker("trigger_hazard", { road_label: roadLabel });
  if (!result) {
    hazardBtn.disabled = false;
    return;
  }

  addLogEntry(
    "hazard",
    `🔥 Fire closes ${roadLabel} — ${result.assignments_staled} household(s) rerouting`
  );
  showToast(`🔥 Fire closes ${roadLabel}!`, "hazard");

  // Fetch the post-reroute state manually (NOT via fetchState(), which would
  // render the new yellow routes immediately) so we control render order:
  // old route in red first, new route only after the flash.
  const apiState = await postWalker("get_state", {});
  if (!apiState) return;
  const mapped = mapApiState(apiState);

  // Reconstruct each affected household's OLD route (as junction segments)
  // from the road labels trigger_hazard reported, using the household's
  // (unchanged) junction from the state we just fetched.
  const roadByLabel = {};
  mapped.roads.forEach(r => { roadByLabel[r.label] = r; });

  const oldSegments = [];
  (result.rerouted || []).forEach(change => {
    const hh = mapped.households.find(h => h.name === change.household_ref);
    if (!hh) return;
    routeToSegments(hh.junction, change.old_route, roadByLabel)
      .forEach(seg => oldSegments.push(seg));
  });

  if (oldSegments.length > 0) {
    showOldRoutesTransient(mapped, oldSegments);
    await sleep(1400);
  }

  STATE = mapped;
  populateJunctionDropdown(mapped);
  render(mapped);   // draw the real (new-route) state now that the flash is done
}

// Draw the map with routing suppressed, then overlay the stale route
// segments in red on top — a temporary frame, not a STATE mutation.
function showOldRoutesTransient(state, oldSegments) {
  render({ ...state, highlightedRoutes: [] });
  const routesLayer = document.getElementById("routes-layer");
  oldSegments.forEach(seg => {
    const a = junctionById(state, seg.from);
    const b = junctionById(state, seg.to);
    if (!a || !b) return;
    el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: "road-line route-old" }, routesLayer);
  });
}

// 🏠 Submit the household form via submit_request(), then refetch.
async function submitHouseholdForm(event) {
  event.preventDefault();

  const textEl = document.getElementById("household-text");
  const junctionEl = document.getElementById("household-junction");
  const rawText = textEl.value.trim();
  const junctionName = junctionEl.value;

  if (!rawText) {
    showToast("Describe the household first.", "info");
    return false;
  }
  if (!junctionName) {
    showToast("Pick a junction first.", "info");
    return false;
  }

  const result = await postWalker("submit_request", {
    raw_text: rawText,
    junction_name: junctionName
  });
  if (!result) return false;

  if (result.shelter_name) {
    addLogEntry("info", `🏠 ${result.household_ref} at ${junctionName} → ${result.shelter_name}`);
    showToast(`🏠 ${result.household_ref} → ${result.shelter_name}`, "info");
  } else {
    addLogEntry("hazard", `🏠 ${result.household_ref} at ${junctionName} → no shelter available`);
    showToast(`🏠 ${result.household_ref}: no qualifying shelter reachable.`, "hazard");
  }

  textEl.value = "";
  await fetchState();
  return false;
}

// ↺ Reset everything via reset_world(), then refetch.
async function resetAll() {
  const result = await postWalker("reset_world", {});
  if (!result) return;

  document.getElementById("event-log").innerHTML =
    '<div style="font-size:12px;color:var(--text-secondary);padding:8px 0;">No events yet.</div>';
  showToast("✓ World reset.", "info");
  await fetchState();
}

// ─── Event log ──────────────────────────────────────────────────
function addLogEntry(type, message) {
  const log = document.getElementById("event-log");
  // Clear placeholder
  if (log.querySelector("div:not(.log-entry)")) {
    log.innerHTML = "";
  }
  const now = new Date().toLocaleTimeString();
  const entry = document.createElement("div");
  entry.className = type === "info" ? "log-entry log-info" : "log-entry";
  entry.innerHTML = `<span class="log-time">${now}</span>${message}`;
  log.prepend(entry);
}

// ─── Toast ──────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (type === "info" ? " info" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = "toast"; }, 2800);
}

// ─── Init ───────────────────────────────────────────────────────
fetchState();
</script>
